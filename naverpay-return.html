<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MIO payment return page moved</title>
  <link rel="canonical" href="./naverpay-return/" />
  <meta http-equiv="refresh" content="0; url=./naverpay-return/" />
</head>
<body>
  <p>This page has moved. <a id="fallback-link" href="./naverpay-return/">Open the new page</a></p>
  <script>
    (function () {
      var destination = new URL("./naverpay-return/", window.location.href);
      destination.search = window.location.search;
      destination.hash = window.location.hash;
      document.getElementById("fallback-link").href = destination.toString();
      window.location.replace(destination.toString());
    }());
  </script>
</body>
</html>
